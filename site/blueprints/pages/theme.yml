title: Theme
icon: brush

# Themes don't need a public sort order
num: 0

# Which fields are "title colors" (used by categories). Single source of truth.
titleColorFields: [title1, title2, title3, title4, title5]

fields:
  backgroundheadline:
    type: headline
    label: Background

  background:
    label: Solid color
    type: color
    width: 1/3
    alpha: false

  backgroundgradient:
    label: CSS gradient
    type: textarea
    buttons: false
    font: monospace
    size: small
    width: 2/3
    help: 'Leave empty for solid background. Example: linear-gradient(90deg, #282A36 0%, #44475a 100%)'
    placeholder: 'linear-gradient(90deg, #fff 0%, #000 100%)'

  stripeheadline:
    type: headline
    label: Top stripe

  stripe:
    label: Solid color
    type: color
    width: 1/3
    alpha: false

  stripegradient:
    label: CSS gradient
    type: textarea
    buttons: false
    font: monospace
    size: small
    width: 2/3
    help: 'Leave empty for solid. Example: linear-gradient(90deg, #F1FA8C 0%, #50FA7B 100%)'
    placeholder: 'linear-gradient(90deg, #fff 0%, #000 100%)'

  stripeheight:
    label: Stripe height
    type: range
    step: 1
    min: 0
    max: 20
    default: 5
    after: px
    width: 1/3

  colorheadline:
    type: headline
    label: Colors

  logo:
    label: Logo
    type: color
    width: 1/6
    alpha: false

  linksheadline:
    type: headline
    label: Link colors

  link:
    label: Link
    type: color
    width: 1/6
    alpha: false

  linkhover:
    label: Link (hover)
    type: color
    width: 1/6
    alpha: false

  titlesheadline:
    type: headline
    label: Category title color options

  title1:
    label: Title 1
    type: color
    width: 1/6
    alpha: false

  title2:
    label: Title 2
    type: color
    width: 1/6
    alpha: false

  title3:
    label: Title 3
    type: color
    width: 1/6
    alpha: false

  title4:
    label: Title 4
    type: color
    width: 1/6
    alpha: false

  title5:
    label: Title 5
    type: color
    width: 1/6
    alpha: false

  otherheadline:
    type: headline
    label: Other options
