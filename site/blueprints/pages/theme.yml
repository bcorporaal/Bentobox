title: Theme
icon: brush

num: 0

titleColorFields: [basetitle, highlighttitle1, highlighttitle2]

columns:
  info:
    width: 1/1
    sections:
      info:
        type: fields
        fields:
          themeinfo:
            width: 2/3
            type: info
            theme: passive
            label: About
            text: '{{ page.description }}'

  sidebar:
    width: 1/3
    sections:
      colors:
        type: fields
        fields:
          colorheadline:
            type: headline
            label: Logo & link colors

          logo:
            label: Logo
            type: color
            alpha: false

          link:
            label: Link
            type: color
            alpha: false

          linkhover:
            label: Link – hover
            type: color
            alpha: false

          titleheadline:
            type: headline
            label: Category title colors

          basetitle:
            label: Base title
            type: color
            alpha: false

          highlighttitle1:
            label: Highlight title 1
            type: color
            alpha: false

          highlighttitle2:
            label: Highlight title 2
            type: color
            alpha: false

  main:
    width: 2/3
    sections:
      fields:
        type: fields
        fields:
          backgroundheadline:
            type: headline
            label: Page background

          background:
            label: Page background – solid color
            help: Used for the page background if no gradient has been defined.
            type: color
            width: 2/3
            alpha: false

          backgroundgradient:
            label: Page background – CSS gradient
            type: textarea
            buttons: false
            font: monospace
            size: small
            width: 1
            help: 'Leave empty for a solid background color. Example: linear-gradient(90deg, #282A36 0%, #44475a 100%)'
            placeholder: 'linear-gradient(90deg, #fff 0%, #000 100%)'

          # stripeheadline:
          #   type: headline
          #   label: Top stripe

          stripe:
            label: Top stripe – solid color
            type: color
            width: 2/3
            alpha: false
            help: Used for the top stripe if no gradient has been defined.

          stripeheight:
            label: Top stripe – height
            type: range
            step: 1
            min: 0
            max: 50
            default: 5
            after: px
            width: 1/3
            help: Set to zero to hide.

          stripegradient:
            label: Top stripe – CSS gradient
            type: textarea
            buttons: false
            font: monospace
            size: small
            width: 1
            help: 'Leave empty for a solid color. Example: linear-gradient(90deg, #F1FA8C 0%, #50FA7B 100%)'
            placeholder: 'linear-gradient(90deg, #fff 0%, #000 100%)'

  fullwidth:
    width: 1/1
    sections:
      css:
        type: fields
        fields:
          linecss:
            type: line

          cssheadline:
            type: headline
            label: Additional CSS

          customcss:
            label: Custom CSS
            type: textarea
            buttons: false
            font: monospace
            size: small
            help: 'Additional CSS added to the page.'
            placeholder: 'body { color: red; }'
